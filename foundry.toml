[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["contracts/lib"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "ekubo-v3/=contracts/lib/ekubo-v3/",
  "solady/=contracts/lib/ekubo-v3/lib/solady/src/"
]
[profile.ekubo]
src = "contracts/ekubo/src"
test = "contracts/ekubo/test"
script = "contracts/ekubo/script"
solc_version = "0.8.33"
evm_version = "osaka"
